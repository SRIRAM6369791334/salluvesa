version: '3.8'

services:
  dash-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saaluvesa_dash_app
    ports:
      - "8080:80"
    environment:
      - APP_NAME=SaaluvesaDash
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8080
      - LOG_CHANNEL=stderr
      - WKHTML_PDF_BINARY=/usr/bin/wkhtmltopdf
    volumes:
      - ./storage:/var/www/html/storage
